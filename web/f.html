<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate your visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>body{min-height:100%}.kiosk{position:static;min-height:100vh}</style>
</head>
<body>
<div class="kiosk"><div class="k-inner" id="k"><div class="loading"><span class="spinner"></span></div></div></div>
<script type="module">
// Public feedback page: f.html?b=<business-slug>. 4–5★ → Google review; 1–3★ → private note to the owner.
// Everyone can still reach Google (Google review policy + IS 19000 forbid hiding it from unhappy customers).
import { sb, friendly } from "./assets/js/sb.js";
import { $, esc } from "./assets/js/ui.js";
const slug = new URLSearchParams(location.search).get("b") || "";
const FACES = ["", "Very bad", "Bad", "Okay", "Good", "Excellent"], ISSUES = ["Waiting time", "Staff behaviour", "Quality", "Price", "Cleanliness", "Something else"];
let B, S = { rating: 0, tags: [] };
const k = $("#k");
const g = (cls) => B.google_review_link ? `<a class="btn ${cls} k-btn" href="${esc(B.google_review_link)}" target="_blank" rel="noopener" id="g">Write a Google review</a>` : "";
function draw(step) {
  if (step === "rate") k.innerHTML = `<p class="k-biz">${esc(B.name)}</p><h1 class="k-q">How was your visit?</h1><p class="k-sub">Tap a star.</p><div class="k-stars">${[1, 2, 3, 4, 5].map((n) => `<button class="k-star" data-n="${n}" aria-label="${n} stars: ${FACES[n]}"><span aria-hidden="true">★</span><b class="num" style="font-size:20px;color:var(--ink)">${n}</b><small>${FACES[n]}</small></button>`).join("")}</div>`;
  if (step === "happy") k.innerHTML = `<div class="k-big">🎉</div><h1 class="k-q">Thank you! We're so glad you enjoyed it.</h1><p class="k-sub">Would you share that on Google? It helps other people find ${esc(B.name)}.</p><div class="k-actions">${g("primary")}<button class="btn k-btn" id="note">Leave a private note</button></div>`;
  if (step === "unhappy") k.innerHTML = `<h1 class="k-q">We're sorry it wasn't great.</h1><p class="k-sub">Tell the owner what went wrong, privately. They'll put it right.</p><div class="chips k-chips">${ISSUES.map((t) => `<button class="chip" data-t="${t}" aria-pressed="${S.tags.includes(t)}">${t}</button>`).join("")}</div>
    <textarea id="txt" placeholder="What happened? (optional)" aria-label="What happened">${esc(S.text || "")}</textarea><input id="nm" placeholder="Your name (optional)" value="${esc(S.name || "")}" aria-label="Your name"><input id="ph" inputmode="tel" placeholder="Your number, if you'd like a reply (optional)" value="${esc(S.phone || "")}" aria-label="Your phone number">
    <p class="err" id="err"></p><div class="k-actions"><button class="btn primary k-btn" id="send">Send to the owner</button>${g("")}</div>`;
  if (step === "thanks") k.innerHTML = `<div class="k-big">🙏</div><h1 class="k-q">Thank you. The owner will see this today.</h1>${S.rating <= 3 && B.google_review_link ? `<p class="k-sub">You're also welcome to share your experience publicly.</p><div class="k-actions">${g("")}</div>` : ""}`;
  k.querySelectorAll("[data-n]").forEach((b) => (b.onclick = async () => { S.rating = +b.dataset.n; if (S.rating >= 4) { draw("happy"); submit(false); } else draw("unhappy"); }));
  k.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { keep(); S.tags = S.tags.includes(b.dataset.t) ? S.tags.filter((x) => x !== b.dataset.t) : [...S.tags, b.dataset.t]; draw("unhappy"); }));
  const n = $("#note"); if (n) n.onclick = () => draw("unhappy");
  const s = $("#send"); if (s) s.onclick = async () => { keep(); s.disabled = true; try { await submit(false); draw("thanks"); } catch (e) { $("#err").textContent = friendly(e); s.disabled = false; } };
  const gl = $("#g"); if (gl && S.rating >= 4) gl.addEventListener("click", () => submit(true).catch(() => {}));
}
const keep = () => { S.text = $("#txt")?.value || S.text; S.name = $("#nm")?.value || S.name; S.phone = $("#ph")?.value || S.phone; };
let sentHappy = false;
async function submit(opened) {
  if (S.rating >= 4 && sentHappy && !opened) return; if (S.rating >= 4) sentHappy = true;
  const { error } = await sb.rpc("submit_feedback", { p_slug: slug, p_rating: S.rating, p_tags: S.tags, p_text: S.text || "", p_name: S.name || "", p_phone: S.phone || "", p_opened_google: !!opened });
  if (error) throw error;
}
(async () => {
  const { data, error } = await sb.rpc("public_business", { p_slug: slug });
  if (error || !data) { k.innerHTML = `<h1 class="k-q">This feedback link isn't working.</h1><p class="k-sub">Please ask the business for a new one.</p>`; return; }
  B = data; document.title = "Rate " + B.name; draw("rate");
})();
</script>
</body>
</html>
